[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jvdata-bridge-mcp"
version = "1.1.0"
description = "AIエージェントから jvdata-bridge の競馬データベースを直接検索・分析できるようにするMCPサーバー"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.18",
    "mcp>=1.30,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pyjwt>=2.15.1,<3",
    "python-dotenv>=1.1,<2",
    "sqlglot>=27,<28",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
jvdata-bridge-mcp = "jvdata_bridge_mcp.cli:main"

[project.optional-dependencies]
research = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<27",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "catboost>=1.2.8,<2",
    "psutil>=6,<8",
    "threadpoolctl>=3.5,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyright>=1.1.400,<2",
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.12,<1",
]

[tool.hatch.build]
exclude = ["/archive", "/archive/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/jvdata_bridge_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 60

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
exclude = [".venv/**", "build/**", "dist/**", "tests/**"]
reportMissingTypeStubs = false
reportMissingImports = "none"
# SQL行とJSON契約のペイロードは、データベースとMCPの境界では意図的に動的です。
# これらの値はランタイムのスキーマテストで検証します。
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"
reportReturnType = "none"

[tool.ruff]
line-length = 119
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["C9", "E", "F", "W", "I", "ANN"]
ignore = [
    "E203",
    "E501",
    "ANN003",
    "ANN401",
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.isort]
known-first-party = ["jvdata_bridge_mcp"]
